<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ここOPEN 法務ページ</title>
<style>
  :root { --bg:#f6f7f5; --ink:#1a1d1b; --ink-muted:#5b6560; --accent:#1f7a5a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141815; --ink:#eef1ee; --ink-muted:#9aa6a0; --accent:#4fbd8f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card { max-width: 420px; text-align: center; }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: var(--ink-muted); font-size: 14px; margin-bottom: 24px; }
  a {
    display: block;
    color: var(--accent);
    font-size: 15px;
    text-decoration: none;
    padding: 12px 0;
    border-top: 1px solid rgba(128,128,128,0.2);
  }
  a:first-of-type { border-top: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>ここOPEN</h1>
    <p>アプリに関する法務ページです。</p>
    <a href="privacy-policy.html">プライバシーポリシー</a>
    <a href="terms-of-service.html">利用規約</a>
  </div>
</body>
</html>
